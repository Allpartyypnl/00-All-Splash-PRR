<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सूचना | कृपया धैर्य रखें</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #0a0a0f;
            background: radial-gradient(ellipse at top left, #1a1a2e 0%, #0a0a0f 55%);
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Very subtle animated grain texture overlay */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
        }

        /* Single elegant glow */
        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 180, 120, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: breathe 9s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 2;
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 2rem;
            padding: 4rem 3rem;
            box-shadow:
                0 40px 100px -30px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* Top accent line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4a574, #f0c987, #d4a574, transparent);
            border-radius: 2px;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Small eyebrow label */
        .eyebrow {
            display: block;
            text-align: center;
            font-size: 0.72rem;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: #d4a574;
            font-weight: 500;
            margin-bottom: 2.2rem;
            padding-left: 0.42em; /* compensate letter-spacing */
        }

        /* Ornament */
        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.4rem;
        }

        .ornament .line {
            height: 1px;
            width: 48px;
            background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.5));
        }

        .ornament .line:last-child {
            background: linear-gradient(90deg, rgba(212, 165, 116, 0.5), transparent);
        }

        .ornament .diamond {
            width: 6px;
            height: 6px;
            background: #d4a574;
            transform: rotate(45deg);
            box-shadow: 0 0 12px rgba(212, 165, 116, 0.8);
        }

        /* Main message — the star of the show */
        .message {
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 1.75rem;
            font-weight: 400;
            line-height: 1.85;
            text-align: center;
            color: #ece7e0;
            letter-spacing: 0.005em;
            margin-bottom: 2.5rem;
            text-wrap: balance;
        }

        .message .accent {
            color: #f0c987;
            font-weight: 500;
            position: relative;
            white-space: nowrap;
        }

        /* Divider with icon */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            margin: 2.5rem 0;
        }

        .divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            max-width: 120px;
        }

        .divider .symbol {
            font-size: 1rem;
            color: rgba(212, 165, 116, 0.8);
            letter-spacing: 0.3em;
            padding-left: 0.3em;
        }

        /* Support line */
        .support {
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            text-align: center;
            color: rgba(236, 231, 224, 0.55);
            line-height: 1.7;
            letter-spacing: 0.01em;
            margin-bottom: 2.5rem;
        }

        /* Footer signature line */
        .signature {
            text-align: center;
            font-size: 0.78rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(212, 165, 116, 0.7);
            font-weight: 500;
            padding-left: 0.28em;
        }

        /* Corner accents */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: rgba(212, 165, 116, 0.25);
            border-style: solid;
        }

        .corner.tl { top: 1.4rem; left: 1.4rem; border-width: 1px 0 0 1px; }
        .corner.tr { top: 1.4rem; right: 1.4rem; border-width: 1px 1px 0 0; }
        .corner.bl { bottom: 1.4rem; left: 1.4rem; border-width: 0 0 1px 1px; }
        .corner.br { bottom: 1.4rem; right: 1.4rem; border-width: 0 1px 1px 0; }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 3rem 1.8rem;
                border-radius: 1.5rem;
            }

            .message {
                font-size: 1.3rem;
                line-height: 1.8;
            }

            .eyebrow {
                font-size: 0.64rem;
                letter-spacing: 0.32em;
                padding-left: 0.32em;
                margin-bottom: 1.6rem;
            }

            .ornament {
                margin-bottom: 1.8rem;
            }

            .support {
                font-size: 0.9rem;
            }

            .signature {
                font-size: 0.7rem;
                letter-spacing: 0.2em;
                padding-left: 0.2em;
            }

            .corner {
                width: 14px;
                height: 14px;
            }

            .corner.tl { top: 1rem; left: 1rem; }
            .corner.tr { top: 1rem; right: 1rem; }
            .corner.bl { bottom: 1rem; left: 1rem; }
            .corner.br { bottom: 1rem; right: 1rem; }
        }

        @media (max-width: 380px) {
            .card {
                padding: 2.5rem 1.3rem;
            }

            .message {
                font-size: 1.12rem;
                line-height: 1.75;
            }
        }

        /* Selection style */
        ::selection {
            background: rgba(212, 165, 116, 0.3);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <span class="eyebrow">सूचना</span>

        <div class="ornament">
            <span class="line"></span>
            <span class="diamond"></span>
            <span class="line"></span>
        </div>

        <p class="message">
            किसी का भी <span class="accent">APK नहीं चल रहा है</span>, किसी से भी पता कर सकते हैं। ठीक करने का ही कोशिश में लगा हुआ हूँ, तब तक कृपया <span class="accent">सब्र रखें</span>। धन्यवाद।
        </p>

        <div class="divider">
            <span class="line"></span>
            <span class="symbol">✦</span>
            <span class="line"></span>
        </div>

        <p class="support">
            कृपया थोड़ा इंतज़ार करें — मैं जल्द ही समाधान निकालूँगा
        </p>

        <div class="signature">धन्यवाद</div>
    </div>
</body>
</html>
